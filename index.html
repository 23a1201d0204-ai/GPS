<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UAV Telemetry Pro Station</title>
  
  <!-- Leaflet Map CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- MQTT JS -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  
  <!-- Google Fonts & FontAwesome (Icons) -->
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* RESET & BASE */
    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; font-family: 'Rajdhani', sans-serif; }
    
    /* MAP LAYER */
    #map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    .leaflet-control-container .leaflet-top { top: 80px; } /* Đẩy nút zoom xuống dưới thanh TopBar */

    /* UI OVERLAY LAYER (GLASSMORPHISM) */
    .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
    .pointer-auto { pointer-events: auto; }

    /* TOP BAR */
    .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(56, 189, 248, 0.4); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5); }
    .logo { color: #38bdf8; font-size: 26px; font-weight: 700; display: flex; align-items: center; gap: 12px; letter-spacing: 2px; text-shadow: 0 0 15px rgba(56,189,248,0.6); }
    
    /* STATUS INDICATORS */
    .status-group { display: flex; gap: 15px; }
    .status-badge { padding: 8px 18px; border-radius: 25px; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; border: 1px solid; letter-spacing: 1px; transition: all 0.3s ease; }
    
    .cloud-ok { background: rgba(22, 163, 74, 0.15); color: #4ade80; border-color: #4ade80; }
    .cloud-err { background: rgba(220, 38, 38, 0.15); color: #f87171; border-color: #f87171; }
    
    .esp-ok { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border-color: #38bdf8; box-shadow: 0 0 15px rgba(56, 189, 248, 0.4); }
    .esp-err { background: rgba(220, 38, 38, 0.2); color: #f87171; border-color: #f87171; animation: pulse-alert 1s infinite; }

    @keyframes pulse-alert { 
      0% { box-shadow: 0 0 0 0 rgba(248, 113, 113, 0.7); }
      70% { box-shadow: 0 0 0 15px rgba(248, 113, 113, 0); }
      100% { box-shadow: 0 0 0 0 rgba(248, 113, 113, 0); }
    }

    /* DASHBOARD BOTTOM */
    .dashboard-container { padding: 25px; display: flex; justify-content: center; }
    .telemetry-panel { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 20px; padding: 20px 30px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.7); width: 100%; max-width: 1400px; }
    
    .data-card { display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
    .data-card:not(:last-child)::after { content: ''; position: absolute; right: -15px; top: 10%; height: 80%; width: 1px; background: rgba(255,255,255,0.1); }
    
    .data-icon { font-size: 24px; color: #94a3b8; margin-bottom: 8px; }
    .data-label { font-size: 13px; color: #94a3b8; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; }
    .data-value { font-family: 'Share Tech Mono', monospace; font-size: 32px; color: #f8fafc; font-weight: 700; margin-top: 5px; text-shadow: 0 0 10px rgba(255,255,255,0.3); }
    .data-unit { font-size: 16px; color: #38bdf8; font-family: 'Rajdhani', sans-serif; }
    
    .highlight-val { color: #4ade80; }
  </style>
</head>
<body>

  <!-- BẢN ĐỒ -->
  <div id="map"></div>

  <!-- GIAO DIỆN CHỒNG LÊN BẢN ĐỒ -->
  <div class="ui-layer">
    
    <!-- THANH TRẠNG THÁI TRÊN CÙNG -->
    <div class="top-bar pointer-auto">
      <div class="logo">
        <i class="fa-solid fa-plane-up"></i> UAV GROUND STATION
      </div>
      <div class="status-group">
        <!-- Đèn báo Cloud MQTT -->
        <div id="cloudStatus" class="status-badge cloud-err">
          <i class="fa-solid fa-server"></i> CLOUD: OFFLINE
        </div>
        <!-- Đèn báo thực tế của con ESP32 -->
        <div id="espStatus" class="status-badge esp-err">
          <i class="fa-solid fa-microchip"></i> ESP32: NO SIGNAL
        </div>
      </div>
    </div>

    <!-- BẢNG THÔNG SỐ BAY DƯỚI CÙNG -->
    <div class="dashboard-container pointer-auto">
      <div class="telemetry-panel">
        <div class="data-card">
          <i class="fa-solid fa-location-crosshairs data-icon"></i>
          <span class="data-label">Vĩ độ (LAT)</span>
          <span class="data-value" id="lat">0.000000</span>
        </div>
        <div class="data-card">
          <i class="fa-solid fa-map-location-dot data-icon"></i>
          <span class="data-label">Kinh độ (LON)</span>
          <span class="data-value" id="lon">0.000000</span>
        </div>
        <div class="data-card">
          <i class="fa-solid fa-mountain data-icon"></i>
          <span class="data-label">Độ cao</span>
          <span class="data-value highlight-val"><span id="alt">0.0</span><span class="data-unit">m</span></span>
        </div>
        <div class="data-card">
          <i class="fa-solid fa-satellite data-icon"></i>
          <span class="data-label">Vệ tinh</span>
          <span class="data-value"><span id="sat">0</span></span>
        </div>
        <div class="data-card">
          <i class="fa-solid fa-battery-half data-icon"></i>
          <span class="data-label">Pin UAV</span>
          <span class="data-value"><span id="bat">0.0</span><span class="data-unit">V</span></span>
        </div>
        <div class="data-card">
          <i class="fa-solid fa-compass data-icon"></i>
          <span class="data-label">Góc Roll / Pitch</span>
          <span class="data-value"><span id="att">0/0</span><span class="data-unit">°</span></span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 1. CẤU HÌNH KÊNH (BẮT BUỘC KHỚP VỚI CODE ESP32)
    const MQTT_TOPIC = "uav/telemetry/du_an_gps_cua_toi_999";
    const BROKER_URL = "wss://broker.emqx.io:8084/mqtt";

    // 2. KHỞI TẠO BẢN ĐỒ GIAO DIỆN TỐI (DARK MODE) CHUẨN QUÂN SỰ
    const map = L.map('map', { zoomControl: true }).setView([21.0285, 105.8542], 16);
    // Dùng bản đồ CartoDB Dark Matter nhìn cực kỳ ngầu
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '© OpenStreetMap © CartoDB',
      maxZoom: 20
    }).addTo(map);

    // Đổi icon marker thành hình máy bay
    const uavIcon = L.divIcon({
      html: '<i class="fa-solid fa-plane" style="color:#38bdf8; font-size:24px; text-shadow: 0 0 10px #38bdf8;"></i>',
      iconSize: [24, 24],
      className: 'uav-marker'
    });
    
    const marker = L.marker([21.0285, 105.8542], {icon: uavIcon}).addTo(map);
    const pathLine = L.polyline([], { color: '#4ade80', weight: 4, opacity: 0.8, shadowBlur: 10, shadowColor: '#4ade80' }).addTo(map);
    let firstFix = true;

    // 3. LOGIC XỬ LÝ KẾT NỐI VÀ TIMEOUT CHO ESP32
    const client = mqtt.connect(BROKER_URL);
    
    const cloudBadge = document.getElementById('cloudStatus');
    const espBadge = document.getElementById('espStatus');
    
    let espTimeout; // Biến lưu bộ đếm thời gian
    const TIMEOUT_MS = 5000; // Nếu sau 5 giây không có dữ liệu từ ESP32 -> Báo mất kết nối

    function setEspOnline() {
      espBadge.className = "status-badge esp-ok";
      espBadge.innerHTML = '<i class="fa-solid fa-wifi"></i> ESP32: ONLINE';
      
      // Xóa bộ đếm cũ và đặt lại bộ đếm mới mỗi khi nhận được tin nhắn
      clearTimeout(espTimeout);
      espTimeout = setTimeout(() => {
        espBadge.className = "status-badge esp-err";
        espBadge.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> ESP32: MẤT KẾT NỐI';
      }, TIMEOUT_MS);
    }

    client.on('connect', () => {
      cloudBadge.className = "status-badge cloud-ok";
      cloudBadge.innerHTML = '<i class="fa-solid fa-server"></i> CLOUD: ĐÃ KẾT NỐI';
      client.subscribe(MQTT_TOPIC);
    });

    client.on('close', () => {
      cloudBadge.className = "status-badge cloud-err";
      cloudBadge.innerHTML = '<i class="fa-solid fa-server"></i> CLOUD: OFFLINE';
    });

    client.on('message', (topic, message) => {
      try {
        // Cứ có tin nhắn tới là xác nhận ESP32 đang sống
        setEspOnline(); 

        const data = JSON.parse(message.toString());
        
        // Cập nhật số liệu lêm bảng điều khiển
        document.getElementById('lat').textContent = data.lat.toFixed(6);
        document.getElementById('lon').textContent = data.lon.toFixed(6);
        document.getElementById('alt').textContent = data.alt.toFixed(1);
        document.getElementById('sat').textContent = data.sat;
        document.getElementById('bat').textContent = data.bat.toFixed(2);
        document.getElementById('att').textContent = `${data.roll.toFixed(0)}/${data.pitch.toFixed(0)}`;

        // Vẽ đường bay và di chuyển máy bay
        if (data.lat !== 0 && data.lon !== 0) {
          const pos = [data.lat, data.lon];
          marker.setLatLng(pos);
          pathLine.addLatLng(pos);
          if (firstFix) {
            map.setView(pos, 18);
            firstFix = false;
          }
        }
      } catch (e) {
        console.error("Lỗi parse JSON:", e);
      }
    });
  </script>
</body>
</html>
